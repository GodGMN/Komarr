name: Komarr feature request
description: Suggest a change to manga acquisition or collection management.
body:
  - type: checkboxes
    attributes:
      label: Existing requests
      options:
        - label: I searched existing issues and the roadmap.
          required: true
  - type: textarea
    attributes:
      label: Manga workflow
      description: Describe the collection or acquisition task you are trying to complete.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Proposed behavior
      description: Explain what Komarr should do, especially when a title or file match is uncertain.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Examples
      description: Add public release names or screenshots if useful. Do not post private tracker links, credentials, or downloaded content.
    validations:
      required: false
