name: Komarr bug report
description: Report a reproducible manga lookup, acquisition, import, or UI problem.
body:
  - type: checkboxes
    attributes:
      label: Existing reports
      options:
        - label: I searched existing issues for this problem.
          required: true
  - type: textarea
    attributes:
      label: What happened?
      description: Include the manga title and the decision or review message if relevant.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add the manga...
        2. Search or scan...
        3. Open the decision or file review...
    validations:
      required: true
  - type: textarea
    attributes:
      label: Environment
      description: Image tag or commit, architecture, Docker or host OS, indexer and download-client versions, and browser if relevant.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Relevant logs
      description: Paste only the relevant lines. Remove private URLs, API keys, cookies, passwords, and backup contents before posting.
    validations:
      required: false
